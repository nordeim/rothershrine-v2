<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The National Shrine of Blessed Stanley Rother in Oklahoma City — plan a pilgrimage, learn the story of the shepherd who stayed, and explore the Pilgrim Center, Shrine Church, and Tepeyac Hill."
    />
    <meta name="theme-color" content="#200a0a" />
    <!--
      Artifact-level CSP for the singlefile build: JS and CSS are inlined by
      vite-plugin-singlefile (hence 'unsafe-inline'), fonts come from Google,
      photography from Pexels, and the map iframe from Google. Host-level
      headers (HSTS, X-Content-Type-Options) cannot be set from a static
      artifact — configure those on the CDN/host as well.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%2333100f'/%3E%3Cpath d='M24 9v21.5' stroke='%23e2bf72' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M24 12c6.2 1.6 9.8 5.4 9.8 10.2 0 3.2-1.6 5.9-4.4 7.7' stroke='%23e2bf72' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M17.5 32.5c2 2.2 4.2 3.7 6.5 5.1 2.3-1.4 4.5-2.9 6.5-5.1' stroke='%23e2bf72' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500;1,9..144,600;1,9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Blessed Stanley Rother Shrine | National Shrine, Oklahoma City</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
